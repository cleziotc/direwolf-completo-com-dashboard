name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python3 -m py_compile app.py database.py dashboard_extensions.py audio_control.py station_config.py offline_maps.py scripts/direwolf-hardware-watchdog.py scripts/check-public-package.py

      - name: Bash syntax
        run: |
          bash -n install-ubuntu.sh
          bash -n install-raspberry.sh
          bash -n scripts/aprs-update.sh
          bash -n scripts/install-common.sh
          bash -n scripts/install-v02-hooks.sh

      - name: Verificações do pacote público
        run: |
          test -s static/index.html
          test -s static/config.html
          test -s requirements.txt
          grep -q "APRS Monitor" static/index.html
          test -s docs/en/README.md
          test -s docs/en/INSTALL-RASPBERRY.md
          grep -q "Daniel, PP5BK" README.md
          grep -q "PTT GPIOD" direwolf.conf.example
          grep -q "render_systemd_unit" scripts/install-common.sh
          grep -q "restart aprs-dashboard.service" scripts/install-common.sh
          grep -q "restart aprs-hardware-watchdog.service" scripts/install-common.sh
          grep -q 'DEFAULT_REPO=' scripts/aprs-update.sh

          if grep -q '/home/aprs/aprs-dashboard' scripts/aprs-update.sh scripts/install-v02-hooks.sh; then
            echo "Caminho fixo legado encontrado em script que deve ser portável."
            exit 1
          fi

          python3 scripts/check-public-package.py
