name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python syntax
        run: |
          python3 -m py_compile app.py database.py dashboard_extensions.py audio_control.py station_config.py offline_maps.py scripts/direwolf-hardware-watchdog.py

      - name: Bash syntax
        run: |
          bash -n install-ubuntu.sh
          bash -n install-raspberry.sh
          bash -n scripts/aprs-update.sh
          bash -n scripts/install-common.sh
          bash -n scripts/install-v02-hooks.sh

      - name: Verificações do pacote público
        run: |
          test -s static/index.html
          test -s static/config.html
          test -s requirements.txt
          grep -q "APRS Monitor" static/index.html
          test -s docs/en/README.md
          test -s docs/en/INSTALL-RASPBERRY.md
          grep -q "Daniel, PP5BK" README.md
          grep -q "PTT GPIOD" direwolf.conf.example
          grep -q "render_systemd_unit" scripts/install-common.sh

          # PP5CI é permitido apenas como crédito. Bloqueamos dados da estação
          # original e credenciais/segredos conhecidos no pacote público.
          if grep -R -n -E 'PP5CI-[0-9]{1,2}|24561|26\.27166|48\.87666' \
            --exclude-dir=.git --exclude=ci.yml .; then
            echo "Dados específicos da estação original encontrados no pacote público."
            exit 1
          fi

          if grep -R -n -E '(github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,})' \
            --exclude-dir=.git .; then
            echo "Possível segredo/token encontrado no repositório."
            exit 1
          fi
